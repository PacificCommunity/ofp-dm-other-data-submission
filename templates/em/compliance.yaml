metadata:
  version: '1.0'
  description: Electronic Monitoring Longline potential compliance event data template
section:
  title: Potential Compliance Event Data
  intro: 'The potential compliance event table captures events identified during EM analysis that may require compliance review.


    Each row represents one potential compliance event and records when and where the event occurred, what part of the EM
    record it relates to, the applicable compliance category and event codes, and analyst comments.'
  notes: '- em_trip_id is a CSV relationship field and must exactly match an em_trip_id in the Trip CSV submitted in the same
    dataset.

    - event_id must be unique within the submission.

    - Datetime values must use ISO 8601 UTC format: YYYY-MM-DDTHH:MM:SSZ.

    - Latitude must use signed DDMM.MMM and longitude signed DDDMM.MMM, consistent with the EM Longline JSON standard.

    - Leave the CSV cell blank where a value is unknown or not applicable.

    - event_relation identifies whether the event relates to a Trip, Set, or Catch record.

    - event_relation_id must contain the corresponding em_trip_id, em_set_id, or em_catch_id according to the value in event_relation.

    - event_category_code and event_type_code must use the standard codes in the [Potential Compliance Categories and Events
    reference table](/em/07_Potential_Compliance_categories_and_Events_reference_codes/).

    - The Mandatory value indicates whether the field is part of the WCPFC Interim Electronic Monitoring Minimum Data Fields,
    based on whether a corresponding DCC and/or WCPFC field name is present in the EM Longline JSON standard. ''No'' does
    not mean that the field should be omitted; non-minimum fields may still be required for CSV relationships, data quality
    control, system integration, or national programme requirements.

    - Summary Yes/No indicators for particular compliance issues do not need to be submitted as separate fields where they
    can be derived from the structured compliance event records.'
columns:
  em_trip_id:
    type: str
    format: Text
    description: Identifier of the parent EM trip. The value must exactly match an em_trip_id in the Trip CSV submitted in
      the same dataset.
    mandatory: false
    example: OCEANVOYAGER20250315
    csv_only: true
  event_id:
    type: str
    format: Text
    description: Unique identifier for the potential compliance event. It may be generated by the source system using information
      such as the event datetime, category code, and event type code.
    mandatory: false
    example: OCEANVOYAGER20250317063000PP1
  event_datetime:
    type: datetime
    format: 'ISO 8601 UTC: YYYY-MM-DDTHH:MM:SSZ'
    description: UTC date and time of the potential compliance event. Compliance events may occur outside setting and hauling
      operations.
    mandatory: false
    example: '2025-03-17T06:30:00Z'
  event_relation:
    type: str
    format: Trip | Set | Catch
    description: 'Indicates the EM record level to which the event relates: Trip, Set, or Catch.'
    mandatory: false
    example: Set
  event_relation_id:
    type: str
    format: Text
    description: Identifier of the related Trip, Set, or Catch record. Provide the applicable em_trip_id, em_set_id, or em_catch_id
      according to event_relation.
    mandatory: false
    example: OCEANVOYAGER2025031520250316194500
  event_lat:
    type: str
    format: Signed DDMM.MMM
    description: Latitude at the time of the potential compliance event.
    mandatory: false
    example: '-1529.100'
  event_lon:
    type: str
    format: Signed DDDMM.MMM
    description: Longitude at the time of the potential compliance event.
    mandatory: false
    example: '+17702.520'
  event_category_code:
    type: str
    format: Regional compliance category code
    description: Category code for the potential compliance issue identified by the EM analyst. Refer to the [Potential Compliance
      Categories and Events reference table](/em/07_Potential_Compliance_categories_and_Events_reference_codes/).
    mandatory: false
    example: P
  event_type_code:
    type: str
    format: Regional compliance event code
    description: Specific compliance event code within the selected compliance category. Refer to the [Potential Compliance
      Categories and Events reference table](/em/07_Potential_Compliance_categories_and_Events_reference_codes/).
    mandatory: false
    example: P1
  comments:
    type: str
    format: Text
    description: Comments from the EM analyst describing the potential compliance event and relevant observable facts.
    mandatory: false
    example: Plastic waste (torn bait packaging) discarded overboard during hauling operations.
